name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v',''
          '{"version":"'+$v+'"}' | Out-File -Encoding utf8 version.json
          Get-Content version.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build updater
        run: go build -trimpath -ldflags "-s -w" -o build/bin/gitlimp-update.exe ./cmd/updater
      - name: Build
        env:
          PATH: ${{ env.ProgramFiles }}\NSIS;%USERPROFILE%\go\bin;${{ env.PATH }}
        run: wails build -trimpath -ldflags "-s -w" -nsis
      - uses: actions/upload-artifact@v4
        with:
          name: gitlimp-windows
          path: |
            build/bin/gitlimp.exe
            build/bin/gitlimp-update.exe
            build/bin/gitlimp-amd64-installer.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "{\"version\":\"${VERSION}\"}" > version.json
          cat version.json
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build updater
        run: go build -trimpath -ldflags "-s -w" -o build/bin/gitlimp-update ./cmd/updater
      - name: Build
        run: wails build -trimpath -ldflags "-s -w" -tags webkit2_41
      - name: Build .deb
        run: |
          mkdir -p build/linux/deb/usr/bin
          cp build/bin/gitlimp build/linux/deb/usr/bin/gitlimp
          cp build/bin/gitlimp-update build/linux/deb/usr/bin/gitlimp-update
          chmod 755 build/linux/deb/usr/bin/gitlimp build/linux/deb/usr/bin/gitlimp-update
          chmod 644 build/linux/deb/DEBIAN/control
          dpkg-deb --build --root-owner-group build/linux/deb gitlimp-1.0.0-amd64.deb
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract > /dev/null
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp build/bin/gitlimp AppDir/usr/bin/
          cp build/bin/gitlimp-update AppDir/usr/bin/
          cp build/linux/deb/usr/share/applications/gitlimp.desktop AppDir/gitlimp.desktop
          cp build/linux/deb/usr/share/applications/gitlimp.desktop AppDir/usr/share/applications/
          cp build/linux/deb/usr/share/icons/hicolor/512x512/apps/gitlimp.png AppDir/usr/share/icons/hicolor/512x512/apps/
          cp build/linux/deb/usr/share/icons/hicolor/512x512/apps/gitlimp.png AppDir/gitlimp.png
          printf '#!/bin/sh\nSELF=$(readlink -f "%s")\nexec "$SELF" --appimage-extract-and-run\n' "$0" > AppDir/AppRun
          chmod +x AppDir/AppRun
          ./squashfs-root/AppRun AppDir gitlimp-1.0.0-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: gitlimp-linux
          path: |
            gitlimp-1.0.0-amd64.deb
            gitlimp-1.0.0-x86_64.AppImage
            build/bin/gitlimp
            build/bin/gitlimp-update

  build-rpm:
    name: Build RPM (Fedora)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: dnf install -y gcc gtk3-devel webkit2gtk4.1-devel pkgconfig golang nodejs npm rpm-build git
      - name: Set version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "{\"version\":\"${VERSION}\"}" > version.json
          cat version.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build updater
        run: go build -trimpath -ldflags "-s -w" -o build/bin/gitlimp-update ./cmd/updater
      - name: Build binary
        run: |
          export PATH=$(go env GOPATH)/bin:$PATH
          wails build -trimpath -ldflags "-s -w" -tags webkit2_41
      - name: Build RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          tar --exclude='.git' --exclude='node_modules' \
              --transform='s,^\./,gitlimp-'${VERSION}'/,' \
              -czf ~/rpmbuild/SOURCES/gitlimp-${VERSION}.tar.gz .
          cp build/linux/gitlimp.spec ~/rpmbuild/SPECS/
          rpmbuild -ba --define "version ${VERSION}" ~/rpmbuild/SPECS/gitlimp.spec
      - uses: actions/upload-artifact@v4
        with:
          name: gitlimp-rpm
          path: |
            ~/rpmbuild/RPMS/**/*.rpm

  build-flatpak:
    name: Build Flatpak
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gitlimp-linux
          path: artifact
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Prepare sources
        run: |
          cp artifact/build/bin/gitlimp build/linux/gitlimp
      - name: Build Flatpak
        run: |
          flatpak install -y --user flathub org.gnome.Platform//48 org.gnome.Sdk//48
          flatpak-builder --user --force-clean --repo=repo flatpak-build build/linux/io.github.velo4705.gitlimp.json
          flatpak build-bundle repo gitlimp-1.0.0-x86_64.flatpak io.github.velo4705.gitlimp
      - uses: actions/upload-artifact@v4
        with:
          name: gitlimp-flatpak
          path: gitlimp-1.0.0-x86_64.flatpak

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-rpm, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
