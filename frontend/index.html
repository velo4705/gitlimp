<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GitLiMP</title>
</head>
<body>
<div id="app">
    <header id="toolbar">
        <button id="open-btn" class="toolbar-btn">Open File...</button>
        <button id="recent-btn" class="toolbar-btn" title="Recent Files (Ctrl+Shift+O)">Recent ▾</button>
        <div id="recent-dropdown" class="dropdown hidden">
            <div id="recent-list"></div>
            <div class="dropdown-footer">
                <button id="clear-recent-btn" class="dropdown-action">Clear Recent</button>
            </div>
        </div>
        <div class="toolbar-spacer"></div>
        <button id="split-btn" class="toolbar-btn" title="Toggle Split View (Ctrl+\\)">Split ▤</button>
        <button id="reload-btn" class="toolbar-btn" disabled title="Reload (Ctrl+R)">⟳</button>
    </header>

    <main id="main">
        <div id="empty-state" class="empty-state">
            <img class="logo-mark" src="/logo.png" width="112" height="112" alt="GitLiMP logo"/>
            <h1>GitLiMP</h1>
            <p>Open markdown files to preview them exactly as GitHub renders them.</p>
            <button id="empty-open-btn" class="empty-open-btn">Open File...</button>
            <p class="hint">Ctrl+O to open · Ctrl+W to close tab · Ctrl+\\ to split</p>
        </div>
        <div id="panes" class="panes hidden">
            <div id="pane-left" class="pane" data-pane="left">
                <div class="pane-tabbar"></div>
                <div class="pane-body"></div>
            </div>
            <div id="pane-right" class="pane hidden" data-pane="right">
                <div class="pane-tabbar"></div>
                <div class="pane-body"></div>
            </div>
        </div>
        <div id="error-banner" class="error-banner hidden"></div>
    </main>

    <footer id="status-bar">
        <span id="status-text">Ready</span>
    </footer>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
